<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nube de Archivos</title>
<style>
  :root{
    --bg:#0f172a; --card:#111c33; --line:#22304f; --txt:#e5e9f2; --mut:#8b97b3;
    --acc:#3b82f6; --acc2:#60a5fa; --ok:#22c55e; --err:#ef4444;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
  .hidden{display:none!important}
  button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:.6rem 1rem;background:var(--acc);color:#fff;font-weight:600}
  button:hover{background:var(--acc2)}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
  button.ghost:hover{border-color:var(--acc)}
  button.danger{background:transparent;border:1px solid #5b2330;color:#fca5a5}
  button.danger:hover{background:#3a1520}
  button:disabled{opacity:.5;cursor:not-allowed}

  /* Login */
  #login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1rem}
  .login-box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:2rem;width:100%;max-width:360px;text-align:center}
  .login-box h1{font-size:1.5rem;margin:.5rem 0 .25rem}
  .login-box p{color:var(--mut);font-size:.9rem;margin-bottom:1.25rem}
  .login-box input{width:100%;padding:.75rem;border-radius:8px;border:1px solid var(--line);background:#0b1426;color:var(--txt);font-size:1rem;margin-bottom:.75rem;text-align:center;letter-spacing:.1em}
  .login-box button{width:100%}
  .err{color:var(--err);font-size:.85rem;min-height:1.2em;margin-top:.5rem}
  .logo{font-size:2.5rem}

  /* App */
  header{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.5rem;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
  header h1{font-size:1.15rem;display:flex;gap:.5rem;align-items:center}
  main{max-width:1000px;margin:0 auto;padding:1.5rem}
  #drop{border:2px dashed var(--line);border-radius:14px;padding:2.5rem 1rem;text-align:center;background:var(--card);transition:.15s;cursor:pointer}
  #drop.over{border-color:var(--acc);background:#13244a}
  #drop .big{font-size:2.2rem}
  #drop p{color:var(--mut);margin-top:.4rem}
  #drop strong{color:var(--txt)}

  #queue{margin-top:1rem;display:flex;flex-direction:column;gap:.5rem}
  .qitem{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.7rem .9rem}
  .qtop{display:flex;justify-content:space-between;gap:1rem;font-size:.9rem}
  .qtop span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar{height:6px;background:#0b1426;border-radius:6px;margin-top:.45rem;overflow:hidden}
  .bar div{height:100%;width:0;background:var(--acc);transition:width .2s}
  .qitem.done .bar div{background:var(--ok)}
  .qitem.fail .bar div{background:var(--err)}

  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin:1.75rem 0 .75rem;flex-wrap:wrap}
  .toolbar h2{font-size:1.05rem}
  .toolbar input{padding:.55rem .8rem;border-radius:8px;border:1px solid var(--line);background:#0b1426;color:var(--txt);min-width:220px}
  .stats{color:var(--mut);font-size:.85rem}

  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  th,td{padding:.75rem .9rem;text-align:left;font-size:.9rem;border-bottom:1px solid var(--line)}
  th{color:var(--mut);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;background:#0e1830}
  tr:last-child td{border-bottom:0}
  td.name{max-width:380px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  td.actions{text-align:right;white-space:nowrap}
  td.actions button{padding:.4rem .7rem;font-size:.82rem;margin-left:.3rem}
  .badge{font-size:.72rem;padding:.15rem .45rem;border-radius:5px;background:#3a2f0b;color:#facc15;margin-left:.4rem}
  .empty{text-align:center;color:var(--mut);padding:2rem}
  .dlprog{font-size:.75rem;color:var(--acc2);margin-right:.4rem}

  #toast{position:fixed;bottom:1.25rem;left:50%;transform:translateX(-50%);background:#1e293b;border:1px solid var(--line);padding:.7rem 1.1rem;border-radius:10px;font-size:.9rem;opacity:0;transition:.25s;pointer-events:none}
  #toast.show{opacity:1}

  @media (max-width:640px){
    th:nth-child(3),td:nth-child(3){display:none}
    td.name{max-width:150px}
  }
</style>
</head>
<body>

<!-- LOGIN -->
<section id="login">
  <div class="login-box">
    <div class="logo">☁️</div>
    <h1>Nube de Archivos</h1>
    <p>Ingresa la contraseña para acceder</p>
    <input id="pass" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button id="btnLogin">Entrar</button>
    <div class="err" id="loginErr"></div>
  </div>
</section>

<!-- APP -->
<section id="app" class="hidden">
  <header>
    <h1>☁️ Nube de Archivos</h1>
    <button class="ghost" id="btnLogout">Salir</button>
  </header>
  <main>
    <div id="drop">
      <div class="big">📤</div>
      <p><strong>Arrastra archivos aquí</strong> o haz clic para seleccionarlos</p>
      <p style="font-size:.8rem">Cualquier tipo y tamaño</p>
      <input type="file" id="fileInput" multiple hidden>
    </div>
    <div id="queue"></div>

    <div class="toolbar">
      <div>
        <h2>Archivos</h2>
        <div class="stats" id="stats"></div>
      </div>
      <input id="search" type="search" placeholder="Buscar archivo...">
    </div>

    <table>
      <thead><tr><th>Nombre</th><th>Tamaño</th><th>Fecha</th><th></th></tr></thead>
      <tbody id="list"><tr><td colspan="4" class="empty">Cargando...</td></tr></tbody>
    </table>
  </main>
</section>

<div id="toast"></div>

<script type="module">
/* =========================================================
   1) PEGA AQUÍ LA CONFIGURACIÓN DE TU PROYECTO FIREBASE
   (Consola Firebase > Configuración del proyecto > Tus apps > Web)
   ========================================================= */
const firebaseConfig = {
  apiKey: "TU_API_KEY",
  authDomain: "TU_PROYECTO.firebaseapp.com",
  projectId: "TU_PROYECTO",
  storageBucket: "TU_PROYECTO.appspot.com",
  messagingSenderId: "000000000000",
  appId: "1:000000000000:web:xxxxxxxxxxxxxx"
};

/* SHA-256 de la contraseña "NUBE". Para cambiarla, reemplaza este hash. */
const PASS_HASH = "656760d66c26bf6e687f563a94d1979e4a1d84d8e6ad3b18a8fc02b7b60453e8";

/* Cada archivo se divide en trozos de ~900 KB (límite de Firestore: 1 MB por documento) */
const CHUNK_SIZE = 900 * 1024;
const PARALLEL = 4; // trozos que se suben / descargan en paralelo

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, doc, setDoc, getDoc, updateDoc, deleteDoc,
  onSnapshot, query, orderBy, serverTimestamp, Bytes
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const FILES = "nube_archivos";

const $ = id => document.getElementById(id);
let unsub = null;
let allFiles = [];

/* ---------- Utilidades ---------- */
async function sha256(txt){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
function fmtSize(b){
  if(b < 1024) return b + " B";
  const u = ["KB","MB","GB","TB"]; let i = -1;
  do { b /= 1024; i++; } while(b >= 1024 && i < u.length-1);
  return b.toFixed(b < 10 ? 2 : 1) + " " + u[i];
}
function fmtDate(ts){
  if(!ts) return "—";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleString("es-PE",{dateStyle:"short",timeStyle:"short"});
}
function esc(s){ return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), 2800);
}
async function pool(items, n, fn){
  let idx = 0;
  const workers = Array.from({length: Math.min(n, items.length)}, async () => {
    while(idx < items.length){ const i = idx++; await fn(items[i], i); }
  });
  await Promise.all(workers);
}

/* ---------- Login ---------- */
async function tryLogin(){
  const h = await sha256($("pass").value.trim());
  if(h === PASS_HASH){
    sessionStorage.setItem("nube_ok", "1");
    showApp();
  } else {
    $("loginErr").textContent = "Contraseña incorrecta";
    $("pass").select();
  }
}
$("btnLogin").onclick = tryLogin;
$("pass").addEventListener("keydown", e => { if(e.key === "Enter") tryLogin(); });
$("btnLogout").onclick = () => {
  sessionStorage.removeItem("nube_ok");
  if(unsub) unsub();
  $("app").classList.add("hidden");
  $("login").classList.remove("hidden");
  $("pass").value = "";
};

function showApp(){
  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
  listen();
}

/* ---------- Lista en tiempo real ---------- */
function listen(){
  if(unsub) unsub();
  unsub = onSnapshot(query(collection(db, FILES), orderBy("createdAt","desc")), snap => {
    allFiles = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, err => {
    $("list").innerHTML = `<tr><td colspan="4" class="empty">Error al conectar con Firestore: ${esc(err.message)}</td></tr>`;
  });
}

function render(){
  const q = $("search").value.toLowerCase().trim();
  const files = allFiles.filter(f => !q || (f.name||"").toLowerCase().includes(q));
  const ready = allFiles.filter(f => f.status === "ready");
  $("stats").textContent = `${ready.length} archivo(s) · ${fmtSize(ready.reduce((a,f)=>a+(f.size||0),0))}`;

  if(!files.length){
    $("list").innerHTML = `<tr><td colspan="4" class="empty">${q ? "Sin resultados" : "Aún no hay archivos. ¡Sube el primero!"}</td></tr>`;
    return;
  }
  $("list").innerHTML = files.map(f => `
    <tr>
      <td class="name" title="${esc(f.name)}">${esc(f.name)}${f.status !== "ready" ? '<span class="badge">subiendo…</span>' : ""}</td>
      <td>${fmtSize(f.size||0)}</td>
      <td>${fmtDate(f.createdAt)}</td>
      <td class="actions">
        <span class="dlprog" id="p_${f.id}"></span>
        <button data-dl="${f.id}" ${f.status !== "ready" ? "disabled" : ""}>Descargar</button>
        <button class="danger" data-del="${f.id}">Eliminar</button>
      </td>
    </tr>`).join("");
}
$("search").addEventListener("input", render);

$("list").addEventListener("click", e => {
  const dl = e.target.dataset.dl, del = e.target.dataset.del;
  if(dl) download(allFiles.find(f => f.id === dl), e.target);
  if(del) removeFile(allFiles.find(f => f.id === del), e.target);
});

/* ---------- Subida ---------- */
const drop = $("drop"), input = $("fileInput");
drop.onclick = () => input.click();
input.onchange = () => { handleFiles(input.files); input.value = ""; };
["dragenter","dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => handleFiles(e.dataTransfer.files));

async function handleFiles(list){
  for(const file of list) await upload(file);   // uno tras otro para no saturar
}

async function upload(file){
  const item = document.createElement("div");
  item.className = "qitem";
  item.innerHTML = `<div class="qtop"><span>${esc(file.name)}</span><span class="pct">0%</span></div><div class="bar"><div></div></div>`;
  $("queue").prepend(item);
  const pct = item.querySelector(".pct"), bar = item.querySelector(".bar div");

  const total = Math.max(1, Math.ceil(file.size / CHUNK_SIZE));
  const ref = doc(collection(db, FILES));
  let done = 0;

  try{
    await setDoc(ref, {
      name: file.name, size: file.size, type: file.type || "application/octet-stream",
      chunks: total, chunkSize: CHUNK_SIZE, status: "uploading", createdAt: serverTimestamp()
    });

    const indexes = [...Array(total).keys()];
    await pool(indexes, PARALLEL, async i => {
      const blob = file.slice(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE);
      const bytes = new Uint8Array(await blob.arrayBuffer());
      await setDoc(doc(db, FILES, ref.id, "chunks", String(i)), { i, data: Bytes.fromUint8Array(bytes) });
      done++;
      const p = Math.round(done / total * 100);
      pct.textContent = `${p}% · ${fmtSize(Math.min(done * CHUNK_SIZE, file.size))} / ${fmtSize(file.size)}`;
      bar.style.width = p + "%";
    });

    await updateDoc(ref, { status: "ready" });
    item.classList.add("done");
    pct.textContent = "✔ Subido";
    setTimeout(() => item.remove(), 4000);
  }catch(err){
    console.error(err);
    item.classList.add("fail");
    pct.textContent = "✖ Error: " + (err.code || err.message);
    toast("Error al subir " + file.name);
  }
}

/* ---------- Descarga ---------- */
async function download(f, btn){
  if(!f) return;
  btn.disabled = true;
  const prog = $("p_" + f.id);
  const parts = new Array(f.chunks);
  let done = 0;
  try{
    await pool([...Array(f.chunks).keys()], PARALLEL, async i => {
      const snap = await getDoc(doc(db, FILES, f.id, "chunks", String(i)));
      if(!snap.exists()) throw new Error("Falta el trozo " + i);
      parts[i] = snap.data().data.toUint8Array();
      done++;
      if(prog) prog.textContent = Math.round(done / f.chunks * 100) + "%";
    });
    const blob = new Blob(parts, { type: f.type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = f.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  }catch(err){
    console.error(err);
    toast("Error al descargar: " + err.message);
  }finally{
    btn.disabled = false;
    if(prog) prog.textContent = "";
  }
}

/* ---------- Eliminar ---------- */
async function removeFile(f, btn){
  if(!f || !confirm(`¿Eliminar "${f.name}"?`)) return;
  btn.disabled = true;
  try{
    await pool([...Array(f.chunks || 0).keys()], 10, i => deleteDoc(doc(db, FILES, f.id, "chunks", String(i))));
    await deleteDoc(doc(db, FILES, f.id));
    toast("Archivo eliminado");
  }catch(err){
    console.error(err);
    toast("Error al eliminar: " + err.message);
    btn.disabled = false;
  }
}

/* ---------- Inicio ---------- */
if(sessionStorage.getItem("nube_ok") === "1") showApp();
else $("pass").focus();
</script>
</body>
</html>
